<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
/* CSS Styles for Sequence Diagram */
{{INLINE_CSS}}

:root {
  --bg-color: #f8fafc;
  --card-bg: #ffffff;
  --border-color: #e2e8f0;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --primary: #2563eb;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background-color: var(--bg-color);
  color: var(--text-main);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px;
}

.header {
  margin-bottom: 20px;
  text-align: center;
}

.header h1 {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--text-main);
}

.header p {
  font-size: 0.875rem;
  color: var(--text-muted);
  margin-top: 4px;
}

.card {
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
  padding: 32px;
  display: inline-block;
  max-width: 100%;
  overflow-x: auto;
}

#diagram {
  display: flex;
  justify-content: center;
  align-items: center;
}

#diagram svg {
  display: block;
  max-width: 100%;
  height: auto;
}

/* Typography refinements for simple theme */
.signal text {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  font-size: 13px !important;
}

.actor text {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  font-weight: 600 !important;
  font-size: 13px !important;
}

.note text {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  font-size: 12px !important;
}

.title text {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  font-weight: 700 !important;
  font-size: 16px !important;
}

.footer {
  margin-top: 24px;
  font-size: 0.75rem;
  color: var(--text-muted);
}
</style>
<script>{{INLINE_SNAP}}</script>
<script>{{INLINE_UNDERSCORE}}</script>
<script>{{INLINE_SEQUENCE}}</script>
<script>{{INLINE_SVGINNER}}</script>
</head>
<body>

<div class="header">
  <h1>{{TITLE}}</h1>
  <p>Rendered with js-sequence-diagrams</p>
</div>

<div class="card">
  <div id="diagram"></div>
</div>

<div class="footer">
  <span>Generated by Antigravity Diagram Skill</span>
</div>

<script>
window.addEventListener("DOMContentLoaded", function() {
  try {
    var rawText = `{{DIAGRAM_SOURCE}}`;
    var container = document.getElementById("diagram");
    var diagram = Diagram.parse(rawText);
    diagram.drawSVG(container, { theme: '{{THEME}}', scale: 1 });
    window.renderStatus = "SUCCESS";
  } catch(e) {
    window.renderStatus = "ERROR: " + (e.stack || e.message);
    document.getElementById("diagram").innerHTML = "<pre style='color:#ef4444; font-family:monospace; padding:16px; background:#fee2e2; border-radius:8px;'>" + e.message + "</pre>";
  }
});
</script>
</body>
</html>
